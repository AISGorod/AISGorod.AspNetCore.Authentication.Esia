name: NuGet publish workflow
on:
  push:
    tags:
      - v*
jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish package into NuGet
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Set package version from release tag
        run: echo "MinVerVersionOverride=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build projects
        uses: ./.github/actions/build-projects

      - name: Publish Esia
        uses: ./.github/actions/publish-project
        with:
          project-name: Esia
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish Esia.BouncyCastle
        uses: ./.github/actions/publish-project
        with:
          project-name: Esia.BouncyCastle
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish Esia.CryptoPro
        uses: ./.github/actions/publish-project
        with:
          project-name: Esia.CryptoPro
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
